# Build mncode Desktop for Windows and Linux (amd64 + arm64).
#
# The Go module uses `replace mncode => ../mncode-cli`, so the public agent-core
# repository (mncuchiinhuttt/mncode) is checked out as a sibling directory.
#
# Triggers:
# - manually from the Actions tab (workflow_dispatch)
# - pushing a tag like v0.1-beta (also publishes a GitHub release)
#
# macOS builds are produced locally (wails build -platform darwin/universal)
# and attached to the release afterwards.

name: Build Desktop

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-amd64
            platform: windows/amd64
          - os: ubuntu-22.04
            name: linux-amd64
            platform: linux/amd64
          - os: ubuntu-22.04
            name: linux-arm64
            platform: linux/arm64
            cross: linux-arm64
          - os: ubuntu-22.04
            name: windows-arm64
            platform: windows/arm64
            cross: windows-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout desktop app
        uses: actions/checkout@v4

      - name: Checkout agent core (sibling for the replace directive)
        uses: actions/checkout@v4
        with:
          repository: mncuchiinhuttt/mncode
          ref: main
          path: mncode-cli

      - name: Relocate agent core next to the app
        # actions/checkout only places repos inside the workspace, but the
        # replace directive resolves ../mncode-cli above the repo root.
        shell: bash
        run: mv mncode-cli ../mncode-cli

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Linux build dependencies
        if: runner.os == 'Linux' && matrix.cross != 'linux-arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.0-dev libnss3-dev pkg-config

      - name: Install arm64 cross toolchain and GTK libs
        if: matrix.cross == 'linux-arm64'
        run: |
          sudo dpkg --add-architecture arm64
          sudo sed -i 's|^deb |deb [arch=amd64,i386] |' /etc/apt/sources.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy main universe" | sudo tee /etc/apt/sources.list.d/arm64-ports.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-updates main universe" | sudo tee -a /etc/apt/sources.list.d/arm64-ports.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-security main universe" | sudo tee -a /etc/apt/sources.list.d/arm64-ports.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu \
            libgtk-3-dev:arm64 libwebkit2gtk-4.0-dev:arm64 libnss3-dev:arm64

      - name: Set up zig (Windows ARM64 cross compiler)
        if: matrix.cross == 'windows-arm64'
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.11.0

      - name: Install Wails CLI
        if: ${{ !matrix.cross }}
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Build frontend
        shell: bash
        run: |
          pnpm --dir frontend install
          pnpm --dir frontend build

      - name: Build (native via Wails CLI)
        if: ${{ !matrix.cross }}
        shell: bash
        run: |
          "$(go env GOPATH)/bin/wails" build -platform ${{ matrix.platform }}

      - name: Build (linux/arm64 cross)
        if: matrix.cross == 'linux-arm64'
        shell: bash
        run: |
          export CC=aarch64-linux-gnu-gcc
          export PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig
          export PKG_CONFIG_ALLOW_CROSS=1
          CGO_ENABLED=1 GOOS=linux GOARCH=arm64 \
            go build -tags desktop,production -ldflags "-w -s" \
            -o build/bin/mncode-desktop

      - name: Build (windows/arm64 cross)
        if: matrix.cross == 'windows-arm64'
        shell: bash
        run: |
          export CC="zig cc -target aarch64-windows-gnu"
          export CXX="zig c++ -target aarch64-windows-gnu"
          CGO_ENABLED=1 GOOS=windows GOARCH=arm64 \
            go build -tags desktop,production -ldflags "-w -s -H windowsgui" \
            -o build/bin/mncode-desktop.exe

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >
          Compress-Archive -Path build/bin/mncode-desktop.exe
          -DestinationPath build/bin/mncode-desktop-${{ github.ref_name }}-windows-amd64.zip

      - name: Package (Linux amd64)
        if: matrix.name == 'linux-amd64'
        shell: bash
        run: >
          tar -czf build/bin/mncode-desktop-${{ github.ref_name }}-linux-amd64.tar.gz
          -C build/bin mncode-desktop

      - name: Package (cross targets)
        if: matrix.cross
        shell: bash
        run: |
          cd build/bin
          if [[ "${{ matrix.name }}" == "linux-arm64" ]]; then
            tar -czf mncode-desktop-${{ github.ref_name }}-linux-arm64.tar.gz mncode-desktop
          else
            zip mncode-desktop-${{ github.ref_name }}-windows-arm64.zip mncode-desktop.exe
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mncode-desktop-${{ matrix.name }}
          path: build/bin/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create signed desktop release manifest
        env:
          RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.MN_CODE_RELEASE_PRIVATE_KEY }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: mncuchiinhuttt/mncode-desktop
          RELEASE_MANIFEST_KEY_ID: mncode-release-2026
        run: |
          test -n "$RELEASE_SIGNING_PRIVATE_KEY" || { echo 'MN_CODE_RELEASE_PRIVATE_KEY is required to publish a release'; exit 1; }
          cat > "$RUNNER_TEMP/sign-release-manifest.go" <<'EOF'
          package main

          import (
          	"crypto/ed25519"
          	"crypto/sha256"
          	"encoding/base64"
          	"encoding/hex"
          	"encoding/json"
          	"fmt"
          	"io/fs"
          	"os"
          	"path/filepath"
          	"sort"
          	"strings"
          	"time"
          )

          type asset struct {
          	Name   string `json:"name"`
          	URL    string `json:"url"`
          	Size   int64  `json:"size"`
          	SHA256 string `json:"sha256"`
          }

          type payload struct {
          	SchemaVersion int     `json:"schemaVersion"`
          	Version       string  `json:"version"`
          	Channel       string  `json:"channel"`
          	IssuedAt      string  `json:"issuedAt"`
          	ExpiresAt     string  `json:"expiresAt"`
          	Assets        []asset `json:"assets"`
          }

          type manifest struct {
          	SchemaVersion int     `json:"schemaVersion"`
          	Version       string  `json:"version"`
          	Channel       string  `json:"channel"`
          	IssuedAt      string  `json:"issuedAt"`
          	ExpiresAt     string  `json:"expiresAt"`
          	KeyID         string  `json:"keyID"`
          	Signature     string  `json:"signature"`
          	Assets        []asset `json:"assets"`
          }

          func main() {
          	if len(os.Args) != 3 {
          		panic("usage: sign-release-manifest <assets-dir> <output>")
          	}
          	tag, repo, keyID := os.Getenv("RELEASE_TAG"), os.Getenv("RELEASE_REPOSITORY"), os.Getenv("RELEASE_MANIFEST_KEY_ID")
          	private, err := base64.StdEncoding.DecodeString(os.Getenv("RELEASE_SIGNING_PRIVATE_KEY"))
          	if err != nil {
          		panic(err)
          	}
          	if len(private) == ed25519.SeedSize {
          		private = ed25519.NewKeyFromSeed(private)
          	}
          	if len(private) != ed25519.PrivateKeySize {
          		panic("release signing key must be base64 Ed25519 seed or private key")
          	}
          	channel := "stable"
          	lowerTag := strings.ToLower(tag)
          	if strings.Contains(lowerTag, "beta") || strings.Contains(lowerTag, "alpha") {
          		channel = "beta"
          	}
          	issued := time.Now().UTC()
          	expires := issued.Add(7 * 24 * time.Hour)
          	assets := []asset{}
          	err = filepath.WalkDir(os.Args[1], func(path string, entry fs.DirEntry, walkErr error) error {
          		if walkErr != nil {
          			return walkErr
          		}
          		if entry.IsDir() {
          			return nil
          		}
          		name := filepath.Base(path)
          		if !strings.HasSuffix(name, ".zip") && !strings.HasSuffix(name, ".tar.gz") {
          			return nil
          		}
          		data, readErr := os.ReadFile(path)
          		if readErr != nil {
          			return readErr
          		}
          		sum := sha256.Sum256(data)
          		assets = append(assets, asset{
          			Name:   name,
          			URL:    fmt.Sprintf("https://github.com/%s/releases/download/%s/%s", repo, tag, name),
          			Size:   int64(len(data)),
          			SHA256: hex.EncodeToString(sum[:]),
          		})
          		return nil
          	})
          	if err != nil {
          		panic(err)
          	}
          	if len(assets) == 0 {
          		panic("no zip or tar.gz release assets found")
          	}
          	sort.Slice(assets, func(i, j int) bool { return assets[i].Name < assets[j].Name })
          	p := payload{1, tag, channel, issued.Format(time.RFC3339), expires.Format(time.RFC3339), assets}
          	canonical, err := json.Marshal(p)
          	if err != nil {
          		panic(err)
          	}
          	sig := ed25519.Sign(ed25519.PrivateKey(private), canonical)
          	encoded, err := json.MarshalIndent(manifest{
          		SchemaVersion: 1,
          		Version:       tag,
          		Channel:       channel,
          		IssuedAt:      p.IssuedAt,
          		ExpiresAt:     p.ExpiresAt,
          		KeyID:         keyID,
          		Signature:     base64.StdEncoding.EncodeToString(sig),
          		Assets:        assets,
          	}, "", "  ")
          	if err != nil {
          		panic(err)
          	}
          	if err := os.WriteFile(os.Args[2], append(encoded, '\n'), 0600); err != nil {
          		panic(err)
          	}
          }
          EOF
          GO111MODULE=off go run "$RUNNER_TEMP/sign-release-manifest.go" artifacts desktop-release-manifest.json

      - name: Attach binaries and manifest to the tag release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.zip
            artifacts/**/*.tar.gz
            desktop-release-manifest.json
          generate_release_notes: true
          fail_on_unmatched_files: true
